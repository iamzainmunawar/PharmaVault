<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pharma Vault — Pakistan Drug Reference</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash">
  <div class="s-mark"></div>
  <div class="s-word">Pharma Vault</div>
  <div class="s-sub">Loading 2,575 generics…</div>
</div>
<div id="app">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <h1>Pharma Vault</h1>
      <span class="sub">Pakistan drug reference</span>
    </div>

    <div class="view-toggle">
      <button id="view-graph-btn" class="active">Graph</button>
      <button id="view-mindmap-btn">Mind Map</button>
    </div>

    <button id="sidebar-toggle" class="hbtn" title="Browse classes as a text tree — the non-graph view">
      <span>&#8942;</span>&nbsp;Browse
    </button>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search a generic, brand, or class…" autocomplete="off">
      <div id="search-results"></div>
    </div>

    <div class="spacer"></div>

    <button id="legend-toggle" class="hbtn">Color Coding</button>
    <button id="interaction-btn" class="hbtn" disabled title="Reserved for a future drug interaction / compatibility module">
      <span class="dot"></span><span class="label">Interaction Checker — coming soon</span>
    </button>
    <span id="stat-pill" class="stat-pill"></span>
  </header>

  <div class="workspace">
    <aside id="sidebar">
      <div id="sidebar-inner">
        <div id="sidebar-head">
          <h3>Vault outline</h3>
          <button id="sidebar-close">✕</button>
        </div>
        <div id="sidebar-tree"></div>
      </div>
    </aside>

    <main>
      <canvas id="graph"></canvas>
      <div id="mindmap-wrap">
        <svg id="mindmap-svg"></svg>
      </div>
      <div id="legend" class="collapsed">
        <div id="legend-swatches"></div>
        <div id="legend-physics">
          <h3 style="margin:0 0 8px;">Spacing</h3>
          <div class="slider-row">
            <div class="slider-row-head"><span>Major-class repel</span><span class="val" id="slider-hub-val"></span></div>
            <input id="slider-hub" type="range" min="0" max="20" step="0.5" value="9">
          </div>
          <div class="slider-row">
            <div class="slider-row-head"><span>Subclass repel</span><span class="val" id="slider-class-val"></span></div>
            <input id="slider-class" type="range" min="0" max="20" step="0.5" value="5.5">
          </div>
          <div class="slider-row">
            <div class="slider-row-head"><span>Link distance</span><span class="val" id="slider-link-val"></span></div>
            <input id="slider-link" type="range" min="30" max="500" step="5" value="100">
          </div>
        </div>
      </div>
      <div id="hint">Scroll / pinch to zoom · drag empty space to pan · drag a node to nudge it · click a node to open it</div>
      <div id="tooltip"></div>
    </main>
  </div>

  <div id="panel">
    <div id="panel-accent"></div>
    <button id="panel-close">✕</button>
    <div id="panel-head">
      <div class="p-kicker" id="panel-kicker"></div>
      <h2 id="panel-title"></h2>
      <div class="p-sub" id="panel-sub"></div>
    </div>
    <div class="child-chip-row" id="panel-chips"></div>
    <input id="panel-search" type="text" placeholder="Filter…">
    <div id="panel-body"></div>
  </div>

  <div id="watermark">Made by Muhammad Zain Munawar</div>
</div>

<script src="d3.min.js"></script>
<script src="vault_data.js"></script>
<script src="app.js"></script>
</body>
</html>
